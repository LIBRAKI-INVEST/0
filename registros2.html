<style>

* {

/* =========================

========================= */

header::after {

}


.header-content {

.logo-icon {

========================= */

.card {

========================= */

.resumo {

      4px;

<script>


/* ==================================================
   CONFIGURAÇÃO FIREBASE
================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDPDnRWP-r28nHHQRT47zGASIyWzvS13Fw",

  authDomain:
    "preditor-lucifer.firebaseapp.com",

  databaseURL:
    "https://preditor-lucifer-default-rtdb.firebaseio.com",

  projectId:
    "preditor-lucifer",

  storageBucket:
    "preditor-lucifer.firebasestorage.app",

  messagingSenderId:
    "409997785375"

};


/* ==================================================
   INICIALIZAR FIREBASE
================================================== */

if (!firebase.apps.length) {

  firebase.initializeApp(
    firebaseConfig
  );

}


const auth =
  firebase.auth();


const db =
  firebase.database();


/* ==================================================
   ELEMENTOS
================================================== */

const container =
  document.getElementById(
    "retiradasPendentes"
  );


const totalRetiradas =
  document.getElementById(
    "totalRetiradas"
  );


const totalAnalise =
  document.getElementById(
    "totalAnalise"
  );


const totalPagas =
  document.getElementById(
    "totalPagas"
  );


/* ==================================================
   ESCAPAR HTML
================================================== */

function escaparHTML(valor) {

  return String(
    valor ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* ==================================================
   FORMATAR KZ
================================================== */

function formatarKz(valor) {

  return Number(
    valor || 0
  ).toLocaleString(
    "pt-AO",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  ) + " Kz";

}


/* ==================================================
   NORMALIZAR MÉTODO
================================================== */

function normalizarMetodo(
  metodo
) {

  const valor =
    String(
      metodo || ""
    )
    .trim()
    .toUpperCase();


  if (
    valor === "PAY PAY" ||
    valor === "PAYPAY"
  ) {

    return "PAY PAY";

  }


  return "BANCO";

}


/* ==================================================
   NORMALIZAR STATUS
================================================== */

function normalizarStatus(
  status
) {

  const s =
    String(
      status || ""
    )
    .trim()
    .toLowerCase();


  if (
    s === "pago" ||
    s === "paga" ||
    s === "aprovado" ||
    s === "aprovada" ||
    s.includes("pago") ||
    s.includes("aprovado")
  ) {

    return "Pago";

  }


  if (
    s === "rejeitado" ||
    s === "rejeitada" ||
    s === "reprovado" ||
    s === "cancelado" ||
    s === "cancelada" ||
    s.includes("rejeit") ||
    s.includes("reprov") ||
    s.includes("cancel")
  ) {

    return "Rejeitado";

  }


  return "Em análise";

}


/* ==================================================
   CLASSE STATUS
================================================== */

function getStatusClass(
  status
) {

  if (
    status === "Pago"
  ) {

    return "pago";

  }


  if (
    status === "Rejeitado"
  ) {

    return "rejeitado";

  }


  return "em-analise";

}


/* ==================================================
   ÍCONE STATUS
================================================== */

function getStatusIcon(
  status
) {

  if (
    status === "Pago"
  ) {

    return `
      <i class="fa-solid fa-circle-check"></i>
    `;

  }


  if (
    status === "Rejeitado"
  ) {

    return `
      <i class="fa-solid fa-circle-xmark"></i>
    `;

  }


  return `
    <i class="fa-solid fa-clock"></i>
  `;

}


/* ==================================================
   FORMATAR DATA
================================================== */

function formatarData(
  valor
) {

  if (
    valor === null ||
    valor === undefined ||
    valor === ""
  ) {

    return "Data não disponível";

  }


  const data =
    new Date(valor);


  if (
    isNaN(
      data.getTime()
    )
  ) {

    return "Data não disponível";

  }


  const dia =
    String(
      data.getDate()
    ).padStart(
      2,
      "0"
    );


  const mes =
    String(
      data.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const ano =
    data.getFullYear();


  const hora =
    String(
      data.getHours()
    ).padStart(
      2,
      "0"
    );


  const minuto =
    String(
      data.getMinutes()
    ).padStart(
      2,
      "0"
    );


  return `${dia}/${mes}/${ano} ${hora}:${minuto}`;

}


/* ==================================================
   OBTER TIMESTAMP
================================================== */

function obterTimestamp(
  data
) {

  if (
    typeof data.timestamp === "number"
  ) {

    return data.timestamp;

  }


  if (
    data.timestamp &&
    !isNaN(
      Number(data.timestamp)
    )
  ) {

    return Number(
      data.timestamp
    );

  }


  if (
    data.data
  ) {

    const d =
      new Date(
        data.data
      );


    if (
      !isNaN(
        d.getTime()
      )
    ) {

      return d.getTime();

    }

  }


  return 0;

}


/* ==================================================
   CALCULAR DADOS DO SAQUE
================================================== */

function calcularDadosSaque(
  data
) {

  /*
   * Valor original solicitado.
   */

  let valorSolicitado =
    Number(
      data.valorRetirada ??
      data.valor ??
      data.valorSaque ??
      0
    );


  /*
   * Taxa gravada no Firebase.
   */

  let taxa =
    Number(
      data.taxa ??
      data.taxaSaque ??
      0
    );


  /*
   * Valor efetivamente recebido.
   */

  let valorLiquido =
    Number(
      data.valorLiquido ??
      data.valorLiquidoRecebido ??
      data.valorRecebido ??
      data.recebido ??
      0
    );


  /*
   * Caso não exista taxa válida,
   * calcula 3%.
   */

  if (
    !Number.isFinite(taxa) ||
    taxa < 0
  ) {

    taxa =
      valorSolicitado * 0.03;

  }


  /*
   * Caso o valor recebido não esteja gravado,
   * calcula automaticamente.
   */

  if (
    !Number.isFinite(valorLiquido) ||
    valorLiquido <= 0
  ) {

    valorLiquido =
      Math.max(
        0,
        valorSolicitado - taxa
      );

  }


  return {

    valorSolicitado:
      valorSolicitado,

    taxa:
      taxa,

    percentualTaxa:
      3,

    valorLiquido:
      valorLiquido

  };

}


/* ==================================================
   AUTENTICAÇÃO
================================================== */

auth.onAuthStateChanged(
  function(user) {


    if (!user) {

      container.innerHTML = `

        <div class="sem-resultados">

          <i class="fa-solid fa-lock"></i>

          Faça login para consultar
          o histórico de retiradas.

        </div>

      `;


      setTimeout(
        function() {

          window.location.href =
            "index.html";

        },
        1200
      );


      return;

    }


    carregarRetiradas(
      user.uid
    );

  }
);


/* ==================================================
   CARREGAR RETIRADAS
   EM TEMPO REAL
================================================== */

function carregarRetiradas(
  uid
) {

  db.ref("retiradas")
    .on(
      "value",
      function(snapshot) {


        const retiradas =
          [];


        if (
          snapshot.exists()
        ) {

          snapshot.forEach(
            function(child) {


              const retirada =
                child.val();


              if (
                retirada &&
                retirada.userId === uid
              ) {

                retiradas.push({

                  id:
                    child.key,

                  ...retirada

                });

              }

            }
          );

        }


        retiradas.sort(
          function(a, b) {

            return (
              obterTimestamp(b) -
              obterTimestamp(a)
            );

          }
        );


        atualizarResumo(
          retiradas
        );


        renderizarRetiradas(
          retiradas
        );

      },


      function(error) {

        console.error(
          "Erro Firebase:",
          error
        );


        container.innerHTML = `

          <div class="sem-resultados">

            <i class="fa-solid fa-triangle-exclamation"></i>

            Não foi possível carregar
            o histórico de retiradas.

          </div>

        `;

      }
    );

}


/* ==================================================
   ATUALIZAR RESUMO
================================================== */

function atualizarResumo(
  retiradas
) {

  let analise = 0;

  let pagas = 0;


  retiradas.forEach(
    function(retirada) {


      const status =
        normalizarStatus(
          retirada.status
        );


      if (
        status === "Em análise"
      ) {

        analise++;

      }


      if (
        status === "Pago"
      ) {

        pagas++;

      }

    }
  );


  totalRetiradas.textContent =
    retiradas.length;


  totalAnalise.textContent =
    analise;


  totalPagas.textContent =
    pagas;

}


/* ==================================================
   RENDERIZAR RETIRADAS
================================================== */

function renderizarRetiradas(
  retiradas
) {


  if (
    retiradas.length === 0
  ) {

    container.innerHTML = `

      <div class="sem-resultados">

        <i class="fa-solid fa-clock-rotate-left"></i>

        Nenhuma retirada encontrada.

        <br><br>

        As suas futuras solicitações
        aparecerão aqui.

      </div>

    `;

    return;

  }


  let html = "";


  retiradas.forEach(
    function(data) {


      const status =
        normalizarStatus(
          data.status
        );


      const statusClass =
        getStatusClass(
          status
        );


      const statusIcon =
        getStatusIcon(
          status
        );


      const metodo =
        normalizarMetodo(
          data.metodo
        );


      const dadosSaque =
        calcularDadosSaque(
          data
        );


      const timestamp =
        data.timestamp ??
        data.data;


      const dataHora =
        formatarData(
          timestamp
        );


      const id =
        data.id
          ? data.id.slice(-8)
          : "N/A";


      /* =========================
         MÉTODO
      ========================= */

      let metodoHTML = "";


      if (
        metodo === "BANCO"
      ) {

        metodoHTML = `

          <div class="metodo-box">

            <i class="fa-solid fa-building-columns"></i>

            SAQUE VIA BANCO

          </div>

        `;

      } else {

        metodoHTML = `

          <div class="metodo-box">

            <i class="fa-solid fa-mobile-screen-button"></i>

            SAQUE VIA PAY PAY

          </div>

        `;

      }


      /* =========================
         ITEM
      ========================= */

      html += `

        <div class="item">


          <!-- =====================
               TOPO
          ====================== -->

          <div class="item-top">


            <div class="valor">

              <span class="valor-label">
                Valor recebido
              </span>


              <div class="valor-principal">

                <i class="fa-solid fa-money-bill-wave"></i>

                <span>
                  ${formatarKz(
                    dadosSaque.valorLiquido
                  )}
                </span>

              </div>

            </div>


            <div
              class="status ${statusClass}"
            >

              ${statusIcon}

              ${escaparHTML(status)}

            </div>


          </div>


          <!-- =====================
               INFORMAÇÕES
          ====================== -->

          <div class="item-body">


            <!-- MÉTODO -->

            <div>

              <i class="${
                metodo === "BANCO"
                  ? "fa-solid fa-building-columns"
                  : "fa-solid fa-mobile-screen-button"
              }"></i>

              <span>

                Método:
                ${escaparHTML(metodo)}

              </span>

            </div>


            <!-- DATA -->

            <div>

              <i class="fa-solid fa-calendar-days"></i>

              <span>

                ${escaparHTML(dataHora)}

              </span>

            </div>


            <!-- ID + VALOR DE SAQUE + TAXA -->

            <div class="id-taxa-row">


              <div class="id-info">

                <i class="fa-solid fa-fingerprint"></i>

                <span class="id-text">

                  ID:
                  ${escaparHTML(id)}

                </span>

              </div>


              <div class="financeiro-info">


                <!-- VALOR DE SAQUE -->

                <div class="saque-info">

                  <i class="fa-solid fa-money-bill-transfer"></i>

                  Saque:
                  ${formatarKz(
                    dadosSaque.valorSolicitado
                  )}

                </div>


                <!-- TAXA -->

                <div class="taxa-info">

                  <i class="fa-solid fa-percent"></i>

                  Taxa:
                  ${formatarKz(
                    dadosSaque.taxa
                  )}

                </div>


              </div>


            </div>


          </div>


          <!-- =====================
               MÉTODO DE SAQUE
          ====================== -->

          ${metodoHTML}


        </div>

      `;

    }
  );


  container.innerHTML =
    html;

}

</script>
